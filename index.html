  /* ===== ПАНЕЛЬ ===== */
  .panel {
    width: 380px;

  }
  .panel h3 {

    margin: 14px 0 8px;
    color: #555;

  }
  .field-block {
    border: 1px solid #e0e0e0;

  }
  .field-block label {

  }
  .field-block input[type="text"],

  }
  .field-block input[type="range"] {

  .field-block .slider-row label {

  .field-block .slider-row span {

    color: #999;

  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .color-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid #ddd;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.1); }

    padding: 8px;

    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .role-toggle button.active {
    background: #007bff;
    color: #fff;
    border-color: #007bff;
  }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .icon-btn {
    border: 2px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    background: #fff;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    transition: border-color 0.15s;
    position: relative;
  }
  .icon-btn:hover { border-color: #007bff; }
  .icon-btn.active { border-color: #007bff; background: #e7f0ff; }
  .icon-btn img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .icon-btn canvas { max-width: 100%; max-height: 100%; }
  .btn-send {
    width: 100%;
    padding: 14px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .btn-send:hover { background: #0056b3; }
  .btn-send:disabled { background: #999; cursor: not-allowed; }

  .preview-area {

    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .preview-area canvas {
    max-width: 100%;
    max-height: 100vh;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    border-radius: 4px;
  }

    background: rgba(0,0,0,0.5);

    align-items: center;
    justify-content: center;
    z-index: 9999;

    max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
