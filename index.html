<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор выпускных лент — 63lenti.ru</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    min-height: 100vh;
  }

  /* ===== ПАНЕЛЬ ===== */
  .panel {
    width: 380px;
    min-width: 380px;
    background: #fff;
    padding: 16px;
    overflow-y: auto;
    max-height: 100vh;
    box-shadow: 2px 0 8px rgba(0,0,0,0.1);
  }
  .panel h2 { font-size: 18px; margin-bottom: 14px; color: #333; text-align: center; }
  .panel h3 { font-size: 14px; margin: 14px 0 8px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  .field-block {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: #fafafa;
  }
  .field-block label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field-block input[type="text"],
  .field-block input[type="number"],
  .field-block input[type="tel"],
  .field-block input[type="email"],
  .field-block select,
  .field-block textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
  }
  .field-block input[type="range"] { width: 100%; }
  .field-block .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .field-block .slider-row label {
    margin: 0;
    min-width: 60px;
  }
  .field-block .slider-row span {
    font-size: 11px;
    color: #999;
    min-width: 30px;
    text-align: right;
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .color-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid #ddd;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #333; border-width: 3px; }
  .role-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .role-toggle button {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .role-toggle button.active {
    background: #007bff;
    color: #fff;
    border-color: #007bff;
  }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .icon-btn {
    border: 2px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    background: #fff;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    transition: border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .icon-btn:hover { border-color: #007bff; }
  .icon-btn.active { border-color: #007bff; background: #e7f0ff; }
  .icon-btn img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .icon-btn canvas { max-width: 100%; max-height: 100%; }
  .btn-send {
    width: 100%;
    padding: 14px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .btn-send:hover { background: #0056b3; }
  .btn-send:disabled { background: #999; cursor: not-allowed; }

  /* ===== ОБЛАСТЬ ПРЕВЬЮ ===== */
  .preview-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .preview-area canvas {
    max-width: 100%;
    max-height: 100vh;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    border-radius: 4px;
  }

  /* ===== АЛЕРТ ===== */
  .alert-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .alert-overlay.visible { display: flex; }
  .alert-box {
    background: #fff;
    border-radius: 12px;
    padding: 30px 40px;
    text-align: center;
    max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .alert-box .icon { font-size: 48px; margin-bottom: 12px; }
  .alert-box h3 { font-size: 18px; margin-bottom: 8px; border: none; color: #333; }
  .alert-box p { font-size: 14px; color: #666; margin-bottom: 16px; }
  .alert-box button {
    padding: 10px 24px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .alert-box button:hover { background: #0056b3; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #e0e0e0;
    border-top-color: #007bff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    .panel { width: 100%; min-width: 100%; max-height: none; }
    .preview-area { padding: 10px; }
  }
</style>
</head>
<body>

    <label>Шрифт</label>

<script>
// ========================================
// НАСТРОЙКИ (редактируйте здесь)
// ========================================

// Почта для заказов
const ORDER_EMAIL = 'maryak250377@gmail.com';

// Цвета ленты (HEX-коды)
const lentColorList = [
  '#C8102E', '#E63946', '#1D3557', '#2A6F97', '#4688F1', '#588157',
  '#90A955', '#F4A261', '#F1C40F', '#8E44AD', '#000000', '#2C3E50',
  '#7D3C98', '#117A65', '#A93226', '#FF8C00', '#008080', '#4A235A'
];

// Цвета шрифта (HEX-код + название)
const fontColorList = [
  {c:'#FFD700', n:'Золото'},
  {c:'#C0C0C0', n:'Серебро'},
  {c:'#FFFFFF', n:'Белый'},
  {c:'#000000', n:'Чёрный'},
  {c:'#8B0000', n:'Бордовый'},
  {c:'#000080', n:'Синий'},
  {c:'#FF00FF', n:'Пурпурный'},
  {c:'#006400', n:'Тёмно-зелёный'}
];

// Шрифты (названия)
const fontList = [
  'Arial', 'Georgia', 'Impact', 'Verdana', 'Tahoma',
  'Times New Roman', 'Courier New', 'Comic Sans MS',
  'Trebuchet MS', 'Palatino Linotype', 'Lucida Console'
];

// ========================================
// СОСТОЯНИЕ
// ========================================
let state = {
  role: 'ВЫПУСКНИЦА',
  lentColor: '#C8102E',
  fontColor: '#FFD700',
  selectedIcon: null, // Выбранная иконка (объект)
  imgSize: 200,
  imgX: 0,
  imgY: 0,
  texts: {
    role:  {font:'Arial',  size:100, x:233, y:142},
    fio:   {font:'Arial',  size:39,  x:458, y:40,  text:'Петрова Марина'},
    school:{font:'Arial',  size:31,  x:546, y:179, text:'МБОУ СОШ №96 г.о.Самара'},
    cls:   {font:'Arial',  size:31,  x:285, y:179, text:'11"А" класс'},
    year:  {font:'Arial',  size:100, x:985, y:135, text:'2027'}
  }
};

// ========================================
// РИСОВАНИЕ ВСТРОЕННЫХ ИКОНОК (Canvas)
// ========================================
function drawIconShape(ctx, name, cx, cy, size) {
  ctx.save();
  ctx.translate(cx, cy);
  const s = size / 2;
  ctx.fillStyle = state.fontColor;
  ctx.strokeStyle = state.fontColor;
  ctx.lineWidth = 2;

  if (name === 'bell') {
    ctx.beginPath();
    ctx.moveTo(-s*0.6, s*0.3);
    ctx.lineTo(s*0.6, s*0.3);
    ctx.lineTo(s*0.5, -s*0.2);
    ctx.quadraticCurveTo(0, -s*0.8, -s*0.5, -s*0.2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, s*0.45, s*0.15, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -s*0.35, s*0.08, 0, Math.PI*2);
    ctx.fill();
  } else if (name === 'cap') {
    ctx.beginPath();
    ctx.moveTo(-s, 0);
    ctx.lineTo(0, -s*0.4);
    ctx.lineTo(s, 0);
    ctx.lineTo(0, s*0.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(-s*0.3, 0, s*0.6, s*0.3);
    ctx.beginPath();
    ctx.moveTo(s*0.8, -s*0.1);
    ctx.lineTo(s*0.9, s*0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s*0.9, s*0.35, s*0.08, 0, Math.PI*2);
    ctx.fill();
  } else if (name === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? s : s * 0.4;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  } else if (name === 'heart') {
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(-s, -s*0.3, -s*0.5, -s, 0, -s*0.3);
    ctx.bezierCurveTo(s*0.5, -s, s, -s*0.3, 0, s*0.3);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ========================================
// ОТРИСОВКА ЛЕНТЫ
// ========================================
function redraw() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Фон-лента
  ctx.fillStyle = state.lentColor;
  ctx.fillRect(0, 0, W, H);

  // Лёгкий градиент для объёма
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(255,255,255,0.12)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Боковые линии (кант)
  ctx.strokeStyle = state.fontColor;
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 2;
  ctx.strokeRect(4, 4, W - 8, H - 8);
  ctx.globalAlpha = 1;

  // Текст цвет
  ctx.fillStyle = state.fontColor;

  // ВЫПУСКНИК / ВЫПУСКНИЦА
  ctx.font = 'bold ' + state.texts.role.size + 'px ' + state.texts.role.font;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(state.role, state.texts.role.x, state.texts.role.y);

  // ФИО
  if (state.texts.fio.text) {
    ctx.font = state.texts.fio.size + 'px ' + state.texts.fio.font;
    ctx.fillText(state.texts.fio.text, state.texts.fio.x, state.texts.fio.y);
  }

  // Школа
  if (state.texts.school.text) {
    ctx.font = state.texts.school.size + 'px ' + state.texts.school.font;
    ctx.fillText(state.texts.school.text, state.texts.school.x, state.texts.school.y);
  }

  // Класс
  if (state.texts.cls.text) {
    ctx.font = state.texts.cls.size + 'px ' + state.texts.cls.font;
    ctx.fillText(state.texts.cls.text, state.texts.cls.x, state.texts.cls.y);
  }

  // Год
  if (state.texts.year.text) {
    ctx.font = 'bold ' + state.texts.year.size + 'px ' + state.texts.year.font;
    ctx.fillText(state.texts.year.text, state.texts.year.x, state.texts.year.y);
  }

  // Картинка
  if (state.selectedIcon) {
    if (state.selectedIcon.type === 'draw') {
      drawIconShape(ctx, state.selectedIcon.drawFn, state.imgX + state.imgSize/2, state.imgY + state.imgSize/2, state.imgSize);
    } else if (state.selectedIcon.type === 'file' && state.selectedIcon.img) {
      ctx.drawImage(state.selectedIcon.img, state.imgX, state.imgY, state.imgSize, state.imgSize);
    }
  }
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ЦВЕТОВ ЛЕНТЫ
// ========================================
function initLentColors() {
  const container = document.getElementById('lent-colors');
  container.innerHTML = '';
  lentColorList.forEach((color, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = color;
    if (color === state.lentColor) sw.classList.add('active');
    sw.onclick = () => {
      state.lentColor = color;
      document.querySelectorAll('#lent-colors .color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      redraw();
    };
    container.appendChild(sw);
  });
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ЦВЕТОВ ШРИФТА
// ========================================
function initFontColors() {
  const container = document.getElementById('font-colors');
  container.innerHTML = '';
  fontColorList.forEach((item, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = item.c;
    sw.title = item.n;
    if (item.c === state.fontColor) sw.classList.add('active');
    sw.onclick = () => {
      state.fontColor = item.c;
      document.querySelectorAll('#font-colors .color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      redraw();
    };
    container.appendChild(sw);
  });
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ВЫПАДАЮЩИХ ШРИФТОВ
// ========================================
function initFontDropdowns() {
  const ids = ['font-role','font-fio','font-school','font-cls','font-year'];
  ids.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    fontList.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f;
      opt.style.fontFamily = f;
      sel.appendChild(opt);
    });
  });
  // Устанавливаем начальные
  document.getElementById('font-role').value = state.texts.role.font;
  document.getElementById('font-fio').value = state.texts.fio.font;
  document.getElementById('font-school').value = state.texts.school.font;
  document.getElementById('font-cls').value = state.texts.cls.font;
  document.getElementById('font-year').value = state.texts.year.font;
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ИКОНОК (ГЛАВНОЕ ИСПРАВЛЕНИЕ)
// ========================================
function initIcons() {
  const container = document.getElementById('icon-list');
  if (!container) {
    console.error('Контейнер для иконок не найден! Проверь id="icon-list" в HTML');
    return;
  }

  container.innerHTML = '';

  // 1. Сначала добавляем встроенные иконки (рисуем их кодом)
  const builtInIcons = [
    {type:'draw', name:'Колокольчик', drawFn:'bell'},
    {type:'draw', name:'Шапочка',     drawFn:'cap'},
    {type:'draw', name:'Звезда',       drawFn:'star'},
    {type:'draw', name:'Сердце',       drawFn:'heart'},
    {type:'none', name:'Без картинки'}
  ];

  builtInIcons.forEach(icon => {
    const btn = createIconButton(icon);
    container.appendChild(btn);
  });

  // 2. Теперь пытаемся загрузить файлы из папки img
  // ВАЖНО: GitHub Pages чувствителен к регистру. 
  // Если файл называется "Gerb.png", а мы ищем "gerb.png", он не найдется.
  // Мы будем искать файлы по списку имен, игнорируя регистр.
  
  const fileNamesToTry = [
    'Gerb.png', 'gerb.png', 'GERB.PNG',
    'Kolokolchik1.png', 'kolokolchik1.png', 'KOLOKOLCHIK1.PNG',
    'Kolokolchik2.png', 'kolokolchik2.png', 'KOLOKOLCHIK2.PNG',
    'Flag.png', 'flag.png', 'FLAG.PNG'
  ];

  // Создаем временный список для проверки существования файлов
  // Мы не можем просто "просканировать" папку, поэтому пробуем загрузить известные имена
  fileNamesToTry.forEach(fileName => {
    const img = new Image();
    img.src = 'img/' + fileName;
    
    img.onload = function() {
      // Если картинка загрузилась, создаем кнопку
      const fileIcon = {
        type: 'file',
        name: fileName.split('.'), // Имя без расширения
        img: img
      };
      
      // Проверяем, не добавили ли мы уже эту картинку (чтобы не дублировать)
      const exists = Array.from(container.children).some(child => {
        const data = child.dataset.name;
        return data && data.toLowerCase() === fileIcon.name.toLowerCase();
      });

      if (!exists) {
        const btn = createIconButton(fileIcon);
        container.appendChild(btn);
      }
    };
    
    img.onerror = function() {
      // Файл не найден, ничего не делаем
    };
  });
}

// Функция создания кнопки с иконкой
function createIconButton(iconData) {
  const btn = document.createElement('div');
  btn.className = 'icon-btn';
  btn.dataset.name = iconData.name; // Сохраняем имя для проверки дубликатов
  
  if (iconData.type === 'none') {
    btn.innerHTML = '<span style="font-size:18px; color:#999">✖</span><br><small>Нет</small>';
  } else if (iconData.type === 'draw') {
    // Для встроенных иконок рисуем маленький canvas прямо в кнопке
    const canvas = document.createElement('canvas');
    canvas.width = 40;
    canvas.height = 40;
    const ctx = canvas.getContext('2d');
    drawIconShape(ctx, iconData.drawFn, 20, 20, 36);
    btn.appendChild(canvas);
    btn.innerHTML += `<br><small>\${iconData.name}</small>`;
  } else if (iconData.type === 'file') {
    // Для файлов используем тег img
    const img = document.createElement('img');
    img.src = iconData.img.src;
    btn.appendChild(img);
    btn.innerHTML += `<br><small>\${iconData.name}</small>`;
  }

  btn.onclick = () => {
    state.selectedIcon = iconData;
    
    // Обновляем визуальное состояние кнопок
    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    redraw();
  };

  return btn;
}

function setRole(role) {
  state.role = role;
  document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById(role === 'ВЫПУСКНИК' ? 'role-grad' : 'role-gradnitsa').classList.add('active');
  redraw();
}

function updateSlider(idVal, idSpan) {
  const val = document.getElementById(idVal).value;
  document.getElementById(idSpan).textContent = val;
  
  // Обновляем состояние в зависимости от того, какой слайдер двигается
  if (idVal === 'img-size') state.imgSize = parseInt(val);
  else if (idVal === 'img-x') state.imgX = parseInt(val);
  else if (idVal === 'img-y') state.imgY = parseInt(val);
  else if (idVal === 'size-role') state.texts.role.size = parseInt(val);
  else if (idVal === 'x-role') state.texts.role.x = parseInt(val);
  else if (idVal === 'y-role') state.texts.role.y = parseInt(val);
  else if (idVal === 'size-fio') state.texts.fio.size = parseInt(val);
  else if (idVal === 'x-fio') state.texts.fio.x = parseInt(val);
  else if (idVal === 'y-fio') state.texts.fio.y = parseInt(val);
  else if (idVal === 'size-school') state.texts.school.size = parseInt(val);
  else if (idVal === 'x-school') state.texts.school.x = parseInt(val);
  else if (idVal === 'y-school') state.texts.school.y = parseInt(val);
  else if (idVal === 'size-cls') state.texts.cls.size = parseInt(val);
  else if (idVal === 'x-cls') state.texts.cls.x = parseInt(val);
  else if (idVal === 'y-cls') state.texts.cls.y = parseInt(val);
  else if (idVal === 'size-year') state.texts.year.size = parseInt(val);
  else if (idVal === 'x-year') state.texts.year.x = parseInt(val);
  else if (idVal === 'y-year') state.texts.year.y = parseInt(val);
  
  redraw();
}

// Привязываем события к слайдерам
document.addEventListener('DOMContentLoaded', () => {
  const sliders = document.querySelectorAll('input[type="range"]');
  sliders.forEach(slider => {
    slider.addEventListener('input', (e) => {
      const idVal = e.target.id;
      const idSpan = idVal + '-val';
      updateSlider(idVal, idSpan);
    });
  });

  // Привязываем выбор шрифта
  const fonts = ['font-role','font-fio','font-school','font-cls','font-year'];
  fonts.forEach(id => {
    const el = document.getElementById(id);
    if(el) {
      el.addEventListener('change', (e) => {
        const key = id.replace('font-', 'role'); // упрощенно
        if(key === 'role') state.texts.role.font = e.target.value;
        else if(key === 'fio') state.texts.fio.font = e.target.value;
        else if(key === 'school') state.texts.school.font = e.target.value;
        else if(key === 'cls') state.texts.cls.font = e.target.value;
        else if(key === 'year') state.texts.year.font = e.target.value;
        redraw();
      });
    }
  });
});

function sendOrder() {
  const name = document.getElementById('ord-name').value;
  const phone = document.getElementById('ord-phone').value;
  
  if (!name || !phone) {
    alert('Пожалуйста, заполните имя и телефон!');
    return;
  }

  const overlay = document.getElementById('alert-overlay');
  const box = document.getElementById('alert-box');
  const icon = document.getElementById('alert-icon');
  const title = document.getElementById('alert-title');
  const text = document.getElementById('alert-text');
  const btn = document.getElementById('alert-btn');

  overlay.classList.add('visible');
  icon.textContent = '⏳';
  title.textContent = 'Отправка заказа...';
  text.textContent = 'Мы получили ваши данные. Менеджер свяжется с вами.';
  btn.style.display = 'none';

  // Имитация отправки (тут можно вставить реальный код отправки на почту или в Telegram)
  setTimeout(() => {
    icon.textContent = '✅';
    title.textContent = 'Заказ отправлен!';
    text.textContent = 'Спасибо за заказ. Мы скоро свяжемся с вами.';
    btn.style.display = 'inline-block';
    btn.onclick = closeAlert;
  }, 1500);
}

function closeAlert() {
  document.getElementById('alert-overlay').classList.remove('visible');
}
