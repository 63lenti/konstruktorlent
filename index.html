<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор выпускных лент — 63lenti.ru</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f2f5;
  display: flex;
  min-height: 100vh;
}

/* ===== ПАНЕЛЬ ===== */
.panel {
  width: 380px;
  min-width: 380px;
  background: #fff;
  padding: 16px;
  overflow-y: auto;
  max-height: 100vh;
  box-shadow: 2px 0 8px rgba(0,0,0,0.1);
}
.panel h2 {
  font-size: 18px;
  margin-bottom: 14px;
  color: #333;
  text-align: center;
}
.panel h3 {
  font-size: 14px;
  margin: 14px 0 8px;
  color: #555;
  border-bottom: 1px solid #ddd;
  padding-bottom: 4px;
}
.field-block {
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  background: #fafafa;
}
.field-block label {
  display: block;
  font-size: 12px;
  color: #666;
  margin-bottom: 4px;
  font-weight: 600;
}
.field-block input[type="text"],
.field-block input[type="number"],
.field-block input[type="tel"],
.field-block input[type="email"],
.field-block select,
.field-block textarea {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 13px;
}
.field-block input[type="range"] {
  width: 100%;
}
.field-block .slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.field-block .slider-row label {
  margin: 0;
  min-width: 60px;
}
.field-block .slider-row span {
  font-size: 11px;
  color: #999;
  min-width: 30px;
  text-align: right;
}
.color-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-top: 4px;
}
.color-swatch {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid #ddd;
  transition: transform 0.15s, border-color 0.15s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.active { border-color: #333; border-width: 3px; }
.role-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.role-toggle button {
  flex: 1;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
}
.role-toggle button.active {
  background: #007bff;
  color: #fff;
  border-color: #007bff;
}
.icon-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 4px;
}
.icon-btn {
  border: 2px solid #ddd;
  border-radius: 6px;
  cursor: pointer;
  background: #fff;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  transition: border-color 0.15s;
}
.icon-btn:hover { border-color: #007bff; }
.icon-btn.active { border-color: #007bff; background: #e7f0ff; }
.icon-btn img {
  max-width: 36px;
  max-height: 36px;
  object-fit: contain;
}
.icon-btn canvas { max-width: 36px; max-height: 36px; }
.btn-send {
  width: 100%;
  padding: 14px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  transition: background 0.2s;
}
.btn-send:hover { background: #0056b3; }
.btn-send:disabled { background: #999; cursor: not-allowed; }

/* ===== ОБЛАСТЬ ПРЕВЬЮ ===== */
.preview-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.preview-area canvas {
  max-width: 100%;
  max-height: 100vh;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  border-radius: 4px;
}

/* ===== СТУДИЯ ===== */
.studio {
  display: none;
}
.studio.visible { display: block; }

/* ===== АЛЕРТ ===== */
.alert-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.alert-overlay.visible { display: flex; }
.alert-box {
  background: #fff;
  border-radius: 12px;
  padding: 30px 40px;
  text-align: center;
  max-width: 400px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.alert-box .icon { font-size: 48px; margin-bottom: 12px; }
.alert-box h3 { font-size: 18px; margin-bottom: 8px; border: none; color: #333; }
.alert-box p { font-size: 14px; color: #666; margin-bottom: 16px; }
.alert-box button {
  padding: 10px 24px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.alert-box button:hover { background: #0056b3; }
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #e0e0e0;
  border-top-color: #007bff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .panel { width: 100%; min-width: 100%; max-height: none; }
  .preview-area { padding: 10px; }
}
</style>
</head>
<body>

    <label>Шрифт</label>

<script>
// ========================================
// НАСТРОЙКИ (редактируйте здесь)
// ========================================

// Почта для заказов
const ORDER_EMAIL = 'maryak250377@gmail.com';

// Цвета ленты (HEX-коды)
const lentColorList = [
  '#C8102E', '#E63946', '#1D3557', '#2A6F97', '#4688F1', '#588157',
  '#90A955', '#F4A261', '#F1C40F', '#8E44AD', '#000000', '#2C3E50',
  '#7D3C98', '#117A65', '#A93226', '#FF8C00', '#008080', '#4A235A'
];

// Цвета шрифта (HEX-код + название)
const fontColorList = [
  {c:'#FFD700', n:'Золото'},
  {c:'#C0C0C0', n:'Серебро'},
  {c:'#FFFFFF', n:'Белый'},
  {c:'#000000', n:'Чёрный'},
  {c:'#8B0000', n:'Бордовый'},
  {c:'#000080', n:'Синий'},
  {c:'#FF00FF', n:'Пурпурный'},
  {c:'#006400', n:'Тёмно-зелёный'}
];

// Шрифты (названия)
const fontList = [
  'Arial', 'Georgia', 'Impact', 'Verdana', 'Tahoma',
  'Times New Roman', 'Courier New', 'Comic Sans MS',
  'Trebuchet MS', 'Palatino Linotype', 'Lucida Console'
];

// Картинки (встроенные иконки + файлы)
// Для своих картинок добавьте: {type:'file', src:'img/logo1.png', name:'Логотип 1'}
const iconList = [
  {type:'draw', name:'Колокольчик', drawFn:'bell'},
  {type:'draw', name:'Шапочка',     drawFn:'cap'},
  {type:'draw', name:'Звезда',       drawFn:'star'},
  {type:'draw', name:'Сердце',       drawFn:'heart'},
  {type:'none', name:'Без картинки'}
];

// ========================================
// СОСТОЯНИЕ
// ========================================
let state = {
  role: 'ВЫПУСКНИЦА',
  lentColor: '#C8102E',
  fontColor: '#FFD700',
  icon: iconList[0],
  imgSize: 200,
  imgX: 0,
  imgY: 0,
  texts: {
    role:  {font:'Arial',  size:100, x:233, y:142},
    fio:   {font:'Arial',  size:39,  x:458, y:40,  text:'Петрова Марина'},
    school:{font:'Arial',  size:31,  x:546, y:179, text:'МБОУ СОШ №96 г.о.Самара'},
    cls:   {font:'Arial',  size:31,  x:285, y:179, text:'11"А" класс'},
    year:  {font:'Arial',  size:100, x:985, y:135, text:'2027'}
  }
};

// ========================================
// РИСОВАНИЕ ИКОНОК
// ========================================
function drawIcon(ctx, name, cx, cy, size) {
  ctx.save();
  ctx.translate(cx, cy);
  const s = size / 2;
  ctx.fillStyle = state.fontColor;
  ctx.strokeStyle = state.fontColor;
  ctx.lineWidth = 2;

  if (name === 'bell') {
    // Колокол
    ctx.beginPath();
    ctx.moveTo(-s*0.6, s*0.3);
    ctx.lineTo(s*0.6, s*0.3);
    ctx.lineTo(s*0.5, -s*0.2);
    ctx.quadraticCurveTo(0, -s*0.8, -s*0.5, -s*0.2);
    ctx.closePath();
    ctx.fill();
    // Язычок
    ctx.beginPath();
    ctx.arc(0, s*0.45, s*0.15, 0, Math.PI*2);
    ctx.fill();
    // Верх
    ctx.beginPath();
    ctx.arc(0, -s*0.35, s*0.08, 0, Math.PI*2);
    ctx.fill();
  } else if (name === 'cap') {
    // Шапочка выпускника
    ctx.beginPath();
    ctx.moveTo(-s, 0);
    ctx.lineTo(0, -s*0.4);
    ctx.lineTo(s, 0);
    ctx.lineTo(0, s*0.4);
    ctx.closePath();
    ctx.fill();
    // Нижняя часть
    ctx.fillRect(-s*0.3, 0, s*0.6, s*0.3);
    // Кисточка
    ctx.beginPath();
    ctx.moveTo(s*0.8, -s*0.1);
    ctx.lineTo(s*0.9, s*0.3);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s*0.9, s*0.35, s*0.08, 0, Math.PI*2);
    ctx.fill();
  } else if (name === 'star') {
    // Звезда
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? s : s * 0.4;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  } else if (name === 'heart') {
    // Сердце
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(-s, -s*0.3, -s*0.5, -s, 0, -s*0.3);
    ctx.bezierCurveTo(s*0.5, -s, s, -s*0.3, 0, s*0.3);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ========================================
// ОТРИСОВКА ЛЕНТЫ
// ========================================
function redraw() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Фон-лента
  ctx.fillStyle = state.lentColor;
  ctx.fillRect(0, 0, W, H);

  // Лёгкий градиент для объёма
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(255,255,255,0.12)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Боковые линии (кант)
  ctx.strokeStyle = state.fontColor;
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 2;
  ctx.strokeRect(4, 4, W - 8, H - 8);
  ctx.globalAlpha = 1;

  // Текст цвет
  ctx.fillStyle = state.fontColor;

  // ВЫПУСКНИК / ВЫПУСКНИЦА
  ctx.font = 'bold ' + state.texts.role.size + 'px ' + state.texts.role.font;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(state.role, state.texts.role.x, state.texts.role.y);

  // ФИО
  if (state.texts.fio.text) {
    ctx.font = state.texts.fio.size + 'px ' + state.texts.fio.font;
    ctx.fillText(state.texts.fio.text, state.texts.fio.x, state.texts.fio.y);
  }

  // Школа
  if (state.texts.school.text) {
    ctx.font = state.texts.school.size + 'px ' + state.texts.school.font;
    ctx.fillText(state.texts.school.text, state.texts.school.x, state.texts.school.y);
  }

  // Класс
  if (state.texts.cls.text) {
    ctx.font = state.texts.cls.size + 'px ' + state.texts.cls.font;
    ctx.fillText(state.texts.cls.text, state.texts.cls.x, state.texts.cls.y);
  }

  // Год
  if (state.texts.year.text) {
    ctx.font = 'bold ' + state.texts.year.size + 'px ' + state.texts.year.font;
    ctx.fillText(state.texts.year.text, state.texts.year.x, state.texts.year.y);
  }

  // Картинка
  if (state.icon) {
    if (state.icon.type === 'draw') {
      drawIcon(ctx, state.icon.drawFn, state.imgX + state.imgSize/2, state.imgY + state.imgSize/2, state.imgSize);
    } else if (state.icon.type === 'file' && state.icon.img) {
      ctx.drawImage(state.icon.img, state.imgX, state.imgY, state.imgSize, state.imgSize);
    }
  }
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ЦВЕТОВ ЛЕНТЫ
// ========================================
function initLentColors() {
  const container = document.getElementById('lent-colors');
  container.innerHTML = '';
  lentColorList.forEach((color, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = color;
    if (color === state.lentColor) sw.classList.add('active');
    sw.onclick = () => {
      state.lentColor = color;
      document.querySelectorAll('#lent-colors .color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      redraw();
    };
    container.appendChild(sw);
  });
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ЦВЕТОВ ШРИФТА
// ========================================
function initFontColors() {
  const container = document.getElementById('font-colors');
  container.innerHTML = '';
  fontColorList.forEach((item, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = item.c;
    sw.title = item.n;
    if (item.c === state.fontColor) sw.classList.add('active');
    sw.onclick = () => {
      state.fontColor = item.c;
      document.querySelectorAll('#font-colors .color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      redraw();
    };
    container.appendChild(sw);
  });
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ВЫПАДАЮЩИХ ШРИФТОВ
// ========================================
function initFontDropdowns() {
  const ids = ['font-role','font-fio','font-school','font-cls','font-year'];
  ids.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    fontList.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f;
      opt.style.fontFamily = f;
      sel.appendChild(opt);
    });
  });
  // Устанавливаем начальные
  document.getElementById('font-role').value = state.texts.role.font;
  document.getElementById('font-fio').value = state.texts.fio.font;
  document.getElementById('font-school').value = state.texts.school.font;
  document.getElementById('font-cls').value = state.texts.cls.font;
  document.getElementById('font-year').value = state.texts.year.font;
}

// ========================================
// ИНИЦИАЛИЗАЦИЯ ИКОНОК
// ========================================
function initIcons() {
  const container = document.getElementById('icon-list');
  container.innerHTML = '';
  iconList.forEach((item, i) => {
    const btn = document.createElement('div');
    btn.className = 'icon-btn';
    if (i === 0) btn.classList.add('active');
    btn.title = item.name;

    if (item.type === 'none') {
      btn.textContent = '✕';
      btn.style.fontSize = '18px';
      btn.style.color = '#999';
    } else if (item.type === 'draw') {
      const c = document.createElement('canvas');
      c.width = 40; c.height = 40;
      const ctx = c.getContext('2d');
      // Рисуем иконку в чёрном (превью)
      const savedColor = state.fontColor;
      state.fontColor = '#333';
      drawIcon(ctx, item.drawFn, 20, 20, 32);
      state.fontColor = savedColor;
      btn.appendChild(c);
    } else if (item.type === 'file') {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.name;
      btn.appendChild(img);
      // Загружаем для канваса
      const realImg = new Image();
      realImg.onload = () => { item.img = realImg; };
      realImg.src = item.src;
    }

    btn.onclick = () => {
      if (item.type === 'none') {
        state.icon = null;
      } else {
        state.icon = item;
        if (item.type === 'file' && !item.img) {
          const img = new Image();
          img.onload = () => { item.img = img; redraw(); };
          img.src = item.src;
        }
      }
      document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      redraw();
    };
    container.appendChild(btn);
  });
}

// ========================================
// УСТАНОВКА РОЛИ
// ========================================
function setRole(r) {
  state.role = r;
  document.getElementById('role-grad').classList.toggle('active', r === 'ВЫПУСКНИК');
  document.getElementById('role-gradnitsa').classList.toggle('active', r === 'ВЫПУСКНИЦА');
  redraw();
}

// ========================================
// СЛАЙДЕРЫ
// ========================================
function bindSliders() {
  // Картинка
  ['img-size','img-x','img-y'].forEach(id => {
    const el = document.getElementById(id);
    const val = document.getElementById(id + '-val');
    el.oninput = () => {
      val.textContent = el.value;
      if (id === 'img-size') state.imgSize = +el.value;
      if (id === 'img-x') state.imgX = +el.value;
      if (id === 'img-y') state.imgY = +el.value;
      redraw();
    };
  });

  // Текстовые элементы
  const elements = [
    {key:'role',  sizeId:'size-role',  xId:'x-role',  yId:'y-role',  fontId:'font-role'},
    {key:'fio',   sizeId:'size-fio',   xId:'x-fio',   yId:'y-fio',   fontId:'font-fio'},
    {key:'school',sizeId:'size-school',xId:'x-school',yId:'y-school',fontId:'font-school'},
    {key:'cls',   sizeId:'size-cls',   xId:'x-cls',   yId:'y-cls',   fontId:'font-cls'},
    {key:'year',  sizeId:'size-year',  xId:'x-year',  yId:'y-year',  fontId:'font-year'}
  ];

  elements.forEach(e => {
    // Размер
    const sizeEl = document.getElementById(e.sizeId);
    const sizeVal = document.getElementById(e.sizeId + '-val');
    sizeEl.oninput = () => {
      sizeVal.textContent = sizeEl.value;
      state.texts[e.key].size = +sizeEl.value;
      redraw();
    };
    // X
    const xEl = document.getElementById(e.xId);
    const xVal = document.getElementById(e.xId + '-val');
    xEl.oninput = () => {
      xVal.textContent = xEl.value;
      state.texts[e.key].x = +xEl.value;
      redraw();
    };
    // Y
    const yEl = document.getElementById(e.yId);
    const yVal = document.getElementById(e.yId + '-val');
    yEl.oninput = () => {
      yVal.textContent = yEl.value;
      state.texts[e.key].y = +yEl.value;
      redraw();
    };
    // Шрифт
    const fontEl = document.getElementById(e.fontId);
    fontEl.onchange = () => {
      state.texts[e.key].font = fontEl.value;
      redraw();
    };
  });

  // Текстовые поля
  document.getElementById('text-fio').oninput = function() {
    state.texts.fio.text = this.value;
    redraw();
  };
  document.getElementById('text-school').oninput = function() {
    state.texts.school.text = this.value;
    redraw();
  };
  document.getElementById('text-cls').oninput = function() {
    state.texts.cls.text = this.value;
    redraw();
  };
  document.getElementById('text-year').oninput = function() {
    state.texts.year.text = this.value;
    redraw();
  };
}

// ========================================
// АЛЕРТЫ
// ========================================
function showAlert(icon, title, text, showBtn) {
  document.getElementById('alert-icon').textContent = icon;
  document.getElementById('alert-title').textContent = title;
  document.getElementById('alert-text').textContent = text;
  document.getElementById('alert-btn').style.display = showBtn ? 'inline-block' : 'none';
  document.getElementById('alert-overlay').classList.add('visible');
}
function showLoadingAlert() {
  document.getElementById('alert-box').innerHTML = '<div class="spinner"></div><h3>Отправка заказа...</h3><p>Пожалуйста, подождите.</p>';
  document.getElementById('alert-overlay').classList.add('visible');
}
function showResultAlert(success, msg) {
  document.getElementById('alert-box').innerHTML = 
    '<div class="icon">' + (success ? '✅' : '❌') + '</div>' +
    '<h3>' + (success ? 'Заказ отправлен!' : 'Ошибка отправки') + '</h3>' +
    '<p>' + msg + '</p>' +
    '<button onclick="closeAlert()">OK</button>';
  document.getElementById('alert-overlay').classList.add('visible');
}
function closeAlert() {
  document.getElementById('alert-overlay').classList.remove('visible');
}

// ========================================
// ОТПРАВКА ЗАКАЗА
// ========================================
function sendOrder() {
  // Проверка обязательных полей
  const name = document.getElementById('ord-name').value.trim();
  const phone = document.getElementById('ord-phone').value.trim();

  if (!name) {
    showResultAlert(false, 'Пожалуйста, укажите ваше имя.');
    return;
  }
  if (!phone) {
    showResultAlert(false, 'Пожалуйста, укажите телефон.');
    return;
  }

  showLoadingAlert();

  const canvas = document.getElementById('canvas');
  canvas.toBlob(function(blob) {
    if (!blob) {
      showResultAlert(false, 'Не удалось создать файл макета. Попробуйте ещё раз.');
      return;
    }

    const formData = new FormData();

    // Данные заказа
    formData.append('Имя', name);
    formData.append('Телефон', phone);
    formData.append('Email', document.getElementById('ord-email').value || 'Не указан');
    formData.append('Количество', document.getElementById('ord-qty').value || '1');
    formData.append('Доставка', document.getElementById('ord-delivery').value || 'Не указано');
    formData.append('Комментарий', document.getElementById('ord-comment').value || 'Нет');

    // Параметры макета
    formData.append('Статус', state.role);
    formData.append('Цвет_ленты', state.lentColor);
    formData.append('Цвет_шрифта', state.fontColor);
    formData.append('ФИО', state.texts.fio.text || 'Не указано');
    formData.append('Школа', state.texts.school.text || 'Не указано');
    formData.append('Класс', state.texts.cls.text || 'Не указано');
    formData.append('Год', state.texts.year.text || 'Не указано');
    formData.append('Шрифт_выпускник', state.texts.role.font);
    formData.append('Шрифт_ФИО', state.texts.fio.font);
    formData.append('Шрифт_школа', state.texts.school.font);
    formData.append('Шрифт_класс', state.texts.cls.font);
    formData.append('Шрифт_год', state.texts.year.font);

    // Макет (PNG)
    formData.append('_attachment', blob, 'maket_lenty.png');

    // Тема письма
    formData.append('_subject', '🎓 Новый заказ ленты: ' + name + ' (' + (document.getElementById('ord-qty').value || '1') + ' шт.)');

    // Anti-spam (FormSubmit)
    formData.append('_template', 'table');
    formData.append('_captcha', 'false');

    fetch('https://formsubmit.co/ajax/' + ORDER_EMAIL, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.success === 'true' || data.success === true) {
        showResultAlert(true, 'Мы получили ваш заказ и свяжемся с вами в ближайшее время!');
      } else {
        throw new Error('Сервер вернул ошибку');
      }
    })
    .catch(error => {
      console.error('Ошибка:', error);
      showResultAlert(false, 'Не удалось отправить заказ автоматически. Пожалуйста, напишите нам на почту: ' + ORDER_EMAIL);
    });
  }, 'image/png', 0.95);
}

// ========================================
// ЗАПУСК
// ========================================
document.addEventListener('DOMContentLoaded', function() {
  initLentColors();
  initFontColors();
  initFontDropdowns();
  initIcons();
  bindSliders();
  redraw();
});
</script>
