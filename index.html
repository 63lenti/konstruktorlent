<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор выпускных лент — 63lenti.ru</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    min-height: 100vh;
  }
  .panel {
    width: 380px;
    min-width: 380px;
    background: #fff;
    padding: 16px;
    overflow-y: auto;
    max-height: 100vh;
    box-shadow: 2px 0 8px rgba(0,0,0,0.1);
  }
  .panel h2 { font-size: 18px; margin-bottom: 14px; color: #333; text-align: center; }
  .panel h3 { font-size: 14px; margin: 14px 0 8px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  .field-block {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: #fafafa;
  }
  .field-block label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field-block input[type="text"],
  .field-block input[type="number"],
  .field-block input[type="tel"],
  .field-block input[type="email"],
  .field-block select,
  .field-block textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
  }
  .field-block input[type="range"] { width: 100%; }
  .field-block .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .field-block .slider-row label { margin: 0; min-width: 60px; }
  .field-block .slider-row span {
    font-size: 11px;
    color: #999;
    min-width: 30px;
    text-align: right;
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .color-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid #ddd;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #333; border-width: 3px; }
  .role-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .role-toggle button {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .role-toggle button.active {
    background: #007bff;
    color: #fff;
    border-color: #007bff;
  }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .icon-btn {
    border: 2px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    background: #fff;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    transition: border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .icon-btn:hover { border-color: #007bff; }
  .icon-btn.active { border-color: #007bff; background: #e7f0ff; }
  .icon-btn img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .btn-send {
    width: 100%;
    padding: 14px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .btn-send:hover { background: #0056b3; }
  .btn-send:disabled { background: #999; cursor: not-allowed; }
  .preview-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #fff;
  }
  .preview-area canvas {
    max-width: 100%;
    max-height: 100vh;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    border-radius: 4px;
  }
  .alert-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .alert-overlay.visible { display: flex; }
  .alert-box {
    background: #fff;
    border-radius: 12px;
    padding: 30px 40px;
    text-align: center;
    max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .alert-box .icon { font-size: 48px; margin-bottom: 12px; }
  .alert-box h3 { font-size: 18px; margin-bottom: 8px; border: none; color: #333; }
  .alert-box p { font-size: 14px; color: #666; margin-bottom: 16px; }
  .alert-box button {
    padding: 10px 24px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .alert-box button:hover { background: #0056b3; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #e0e0e0;
    border-top-color: #007bff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 900px) {
    body { flex-direction: column; }
    .panel { width: 100%; min-width: 100%; max-height: none; }
    .preview-area { padding: 10px; }
  }
</style>
</head>
<body>

<!-- ===== ЛЕВАЯ ПАНЕЛЬ ===== -->
<div class="panel">
  <h2>🎓 Конструктор лент</h2>

  <!-- Роль -->
  <h3>Статус</h3>
  <div class="role-toggle">
    <button id="role-grad" onclick="setRole('ВЫПУСКНИК')">ВЫПУСКНИК</button>
    <button id="role-gradnitsa" class="active" onclick="setRole('ВЫПУСКНИЦА')">ВЫПУСКНИЦА</button>
  </div>

  <!-- Цвет ленты -->
  <h3>Цвет ленты</h3>
  <div class="color-grid" id="lent-colors"></div>

  <!-- Цвет шрифта -->
  <h3>Цвет шрифта</h3>
  <div class="color-grid" id="font-colors"></div>

  <!-- Картинка -->
  <h3>Картинка</h3>
  <div class="icon-grid" id="icon-list"></div>
  <div class="field-block">
    <label>Размер картинки</label>
    <div class="slider-row">
      <input type="range" id="img-size" min="20" max="200" value="200" oninput="updateVal('img-size')">
      <span id="img-size-val">200</span>
    </div>
    <label>Позиция X</label>
    <div class="slider-row">
      <input type="range" id="img-x" min="-600" max="600" value="0" oninput="updateVal('img-x')">
      <span id="img-x-val">0</span>
    </div>
    <label>Позиция Y</label>
    <div class="slider-row">
      <input type="range" id="img-y" min="-100" max="100" value="0" oninput="updateVal('img-y')">
      <span id="img-y-val">0</span>
    </div>
  </div>

  <!-- ВЫПУСКНИК / ВЫПУСКНИЦА -->
  <div class="field-block">
    <h3 style="margin-top:0;border:none">ВЫПУСКНИК / ВЫПУСКНИЦА</h3>
    <label>Шрифт</label>
    <select id="font-role"></select>
    <label>Размер</label>
    <div class="slider-row">
      <input type="range" id="size-role" min="10" max="200" value="100" oninput="updateVal('size-role')">
      <span id="size-role-val">100</span>
    </div>
    <label>Позиция X</label>
    <div class="slider-row">
      <input type="range" id="x-role" min="0" max="1200" value="233" oninput="updateVal('x-role')">
      <span id="x-role-val">233</span>
    </div>
    <label>Позиция Y</label>
    <div class="slider-row">
      <input type="range" id="y-role" min="0" max="200" value="142" oninput="updateVal('y-role')">
      <span id="y-role-val">142</span>
    </div>
  </div>

  <!-- ФИО -->
  <div class="field-block">
    <h3 style="margin-top:0;border:none">ФИО</h3>
    <input type="text" id="text-fio" placeholder="Иванов Иван Иванович" value="Петрова Марина" oninput="redraw()">
    <label>Шрифт</label>
    <select id="font-fio"></select>
    <label>Размер</label>
    <div class="slider-row">
      <input type="range" id="size-fio" min="10" max="200" value="39" oninput="updateVal('size-fio')">
      <span id="size-fio-val">39</span>
    </div>
    <label>Позиция X</label>
    <div class="slider-row">
      <input type="range" id="x-fio" min="0" max="1200" value="458" oninput="updateVal('x-fio')">
      <span id="x-fio-val">458</span>
    </div>
    <label>Позиция Y</label>
    <div class="slider-row">
      <input type="range" id="y-fio" min="0" max="200" value="40" oninput="updateVal('y-fio')">
      <span id="y-fio-val">40</span>
    </div>
  </div>

  <!-- Школа -->
  <div class="field-block">
    <h3 style="margin-top:0;border:none">Школа</h3>
    <input type="text" id="text-school" placeholder="МБОУ СОШ №1" value="МБОУ СОШ №96 г.о.Самара" oninput="redraw()">
    <label>Шрифт</label>
    <select id="font-school"></select>
    <label>Размер</label>
    <div class="slider-row">
      <input type="range" id="size-school" min="10" max="200" value="31" oninput="updateVal('size-school')">
      <span id="size-school-val">31</span>
    </div>
    <label>Позиция X</label>
    <div class="slider-row">
      <input type="range" id="x-school" min="0" max="1200" value="546" oninput="updateVal('x-school')">
      <span id="x-school-val">546</span>
    </div>
    <label>Позиция Y</label>
    <div class="slider-row">
      <input type="range" id="y-school" min="0" max="200" value="179" oninput="updateVal('y-school')">
      <span id="y-school-val">179</span>
    </div>
  </div>

  <!-- Класс -->
  <div class="field-block">
    <h3 style="margin-top:0;border:none">Класс</h3>
    <input type="text" id="text-cls" placeholder='9 «В»' value="11«А» класс" oninput="redraw()">
    <label>Шрифт</label>
    <select id="font-cls"></select>
    <label>Размер</label>
    <div class="slider-row">
      <input type="range" id="size-cls" min="10" max="200" value="31" oninput="updateVal('size-cls')">
      <span id="size-cls-val">31</span>
    </div>
    <label>Позиция X</label>
    <div class="slider-row">
      <input type="range" id="x-cls" min="0" max="1200" value="285" oninput="updateVal('x-cls')">
      <span id="x-cls-val">285</span>
    </div>
    <label>Позиция Y</label>
    <div class="slider-row">
      <input type="range" id="y-cls" min="0" max="200" value="179" oninput="updateVal('y-cls')">
      <span id="y-cls-val">179</span>
    </div>
  </div>

  <button class="btn-send" onclick="alert('Заказ сформирован!')">Заказать ленту</button>
</div>

<!-- ===== ОБЛАСТЬ ПРЕВЬЮ ===== -->
<div class="preview-area">
  <canvas id="canvas" width="1200" height="200"></canvas>
</div>

<!-- ===== АЛЕРТ ===== -->
<div class="alert-overlay" id="alert">
  <div class="alert-box">
    <div class="spinner"></div>
    <h3>Загрузка...</h3>
    <p>Пожалуйста, подождите, пока загрузятся изображения.</p>
  </div>
</div>

<script>
  // --- КОНФИГУРАЦИЯ ---
  const colors = [
    '#FF0000', '#0000FF', '#008000', '#FFFF00', '#00FFFF', '#FF00FF',
    '#800000', '#000080', '#808000', '#800080', '#008080', '#C0C0C0',
    '#808080', '#FFA500', '#FFC0CB'
  ];
  
  const fonts = ['Arial', 'Times New Roman', 'Verdana', 'Georgia', 'Courier New'];

  // --- ИНИЦИАЛИЗАЦИЯ ---
  let ctx;
  let imgObj = null; // Выбранная картинка
  let roleText = 'ВЫПУСКНИЦА';
  let lentColor = '#FF0000';
  let fontColor = '#FFFFFF';

  function init() {
    const canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    
    // Заполняем списки цветов
    renderColors('lent-colors', colors, (c) => { lentColor = c; redraw(); });
    renderColors('font-colors', colors, (c) => { fontColor = c; redraw(); });

    // Заполняем списки шрифтов
    fillSelect('font-role', fonts);
    fillSelect('font-fio', fonts);
    fillSelect('font-school', fonts);
    fillSelect('font-cls', fonts);

    // Загружаем картинки из папки img
    loadImages();

    // Первый рендер
    redraw();
  }

  // --- ОТРИСОВКА ---
  function redraw() {
    if (!ctx) return;

    const w = 1200;
    const h = 200;
    
    // 1. Рисуем фон (ленту)
    ctx.fillStyle = lentColor;
    ctx.fillRect(0, 0, w, h);

    // 2. Рисуем статус (ВЫПУСКНИК/ВЫПУСКНИЦА)
    ctx.fillStyle = fontColor;
    const fRole = document.getElementById('font-role').value;
    const sRole = parseInt(document.getElementById('size-role').value);
    ctx.font = `${sRole}px ${fRole}`;
    ctx.textAlign = 'left';
    ctx.fillText(roleText, parseInt(document.getElementById('x-role').value), parseInt(document.getElementById('y-role').value));

    // 3. Рисуем картинку
    if (imgObj) {
      const size = parseInt(document.getElementById('img-size').value);
      const x = parseInt(document.getElementById('img-x').value);
      const y = parseInt(document.getElementById('img-y').value);
      ctx.drawImage(imgObj, x, y, size, size);
    }

    // 4. Рисуем ФИО
    const fFio = document.getElementById('font-fio').value;
    const sFio = parseInt(document.getElementById('size-fio').value);
    ctx.font = `${sFio}px ${fFio}`;
    ctx.fillText(document.getElementById('text-fio').value, parseInt(document.getElementById('x-fio').value), parseInt(document.getElementById('y-fio').value));

    // 5. Рисуем Школу
    const fSch = document.getElementById('font-school').value;
    const sSch = parseInt(document.getElementById('size-school').value);
    ctx.font = `${sSch}px ${fSch}`;
    ctx.fillText(document.getElementById('text-school').value, parseInt(document.getElementById('x-school').value), parseInt(document.getElementById('y-school').value));

    // 6. Рисуем Класс
    const fCls = document.getElementById('font-cls').value;
    const sCls = parseInt(document.getElementById('size-cls').value);
    ctx.font = `${sCls}px ${fCls}`;
    ctx.fillText(document.getElementById('text-cls').value, parseInt(document.getElementById('x-cls').value), parseInt(document.getElementById('y-cls').value));
  }

  // --- УПРАВЛЕНИЕ ---
  function setRole(text) {
    roleText = text;
    document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    redraw();
  }

  function updateVal(id) {
    document.getElementById(id + '-val').innerText = document.getElementById(id).value;
    redraw();
  }

  function renderColors(containerId, colorList, callback) {
    const container = document.getElementById(containerId);
    colorList.forEach(c => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.backgroundColor = c;
      swatch.onclick = () => {
        document.querySelectorAll(`.color-swatch`).forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        callback(c);
      };
      if (c === '#FF0000' && containerId === 'lent-colors') swatch.classList.add('active');
      if (c === '#FFFFFF' && containerId === 'font-colors') swatch.classList.add('active');
      container.appendChild(swatch);
    });
  }

  function fillSelect(id, options) {
    const sel = document.getElementById(id);
    options.forEach(opt => {
      const optEl = document.createElement('option');
      optEl.value = opt;
      optEl.innerText = opt;
      sel.appendChild(optEl);
    });
    sel.onchange = redraw;
  }

  // --- ЗАГРУЗКА КАРТИНОК ---
  function loadImages() {
    const list = document.getElementById('icon-list');
    const noImgBtn = document.createElement('div');
    noImgBtn.className = 'icon-btn active';
    noImgBtn.innerHTML = '<span style="color:#999; font-size:12px">Без<br>картинки</span>';
    noImgBtn.onclick = () => {
      document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
      noImgBtn.classList.add('active');
      imgObj = null;
      redraw();
    };
    list.appendChild(noImgBtn);

    // Эмуляция загрузки (так как JS не может читать файлы с диска без сервера)
    // В реальном проекте здесь был бы fetch запрос к папке img
    // Для демонстрации я создам заглушки, но логика ниже настроена на реальные файлы
    
    const imgPaths = [
      'img/test.png', 'img/gerb.png', 'img/kolokol.png', 'img/medal.png',
      'img/star.png', 'img/cap.png', 'img/bell.png', 'img/heart.png'
    ];

    imgPaths.forEach(path => {
      const btn = document.createElement('div');
      btn.className = 'icon-btn';
      const img = new Image();
      img.src = path;
      
      img.onload = () => {
        btn.appendChild(img);
        btn.onclick = () => {
          document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          imgObj = img;
          redraw();
        };
        list.appendChild(btn);
      };
      
      img.onerror = () => {
        // Если картинки нет, не показываем кнопку, чтобы не было пустых квадратов
        // Или можно показать заглушку
      };
    });
  }

  // Показываем алерт при загрузке
  window.onload = () => {
    document.getElementById('alert').classList.add('visible');
    setTimeout(() => {
      document.getElementById('alert').classList.remove('visible');
      init();
    }, 500);
  };
</script>
</body>
</html>
